<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign AI - Intelligent Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --bg-dark: #0f0f23;
            --bg-card: #1a1a2e;
            --bg-input: #16213e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent-purple: #667eea;
            --accent-pink: #f5576c;
            --success: #00d9a5;
            --warning: #f5a623;
            --error: #ff6b6b;
            --border-radius: 16px;
            --shadow-glow: 0 0 40px rgba(102, 126, 234, 0.3);
        }

        body {
            font-family: 'Inter', 'Kanit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 80%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(245, 87, 108, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(0, 217, 165, 0.1) 0%, transparent 40%);
            animation: bgRotate 30s linear infinite;
        }

        @keyframes bgRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Floating Particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent-purple);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 2s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 4s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 6s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 8s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 10s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 12s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 14s; }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        /* Main Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 0 30px;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 600;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            display: inline-block;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Messages Area */
        .messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px;
            background: rgba(26, 26, 46, 0.6);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 400px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--accent-purple);
            border-radius: 3px;
        }

        /* Message Bubbles */
        .message {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: messageSlideIn 0.3s ease-out;
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .avatar.ai {
            background: var(--primary-gradient);
        }

        .avatar.user {
            background: var(--secondary-gradient);
        }

        .message-content {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.5;
        }

        .message.ai .message-content {
            background: rgba(102, 126, 234, 0.15);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-top-left-radius: 4px;
        }

        .message.user .message-content {
            background: var(--primary-gradient);
            border-top-right-radius: 4px;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 6px;
            text-align: right;
        }

        .message.user .message-time {
            text-align: left;
        }

        /* Input Area */
        .input-area {
            display: flex;
            gap: 12px;
            padding: 20px;
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #userInput {
            width: 100%;
            padding: 16px 20px;
            background: var(--bg-input);
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        #userInput:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        #userInput::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            padding: 16px 24px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .quick-action {
            padding: 8px 16px;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-action:hover {
            background: rgba(102, 126, 234, 0.2);
            color: var(--text-primary);
            border-color: var(--accent-purple);
        }

        /* Status Indicator */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 4px;
            padding: 14px 18px;
            background: rgba(102, 126, 234, 0.15);
            border-radius: 16px;
            border-top-left-radius: 4px;
            width: fit-content;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-purple);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        /* Welcome Screen */
        .welcome-screen {
            text-align: center;
            padding: 60px 20px;
        }

        .welcome-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .welcome-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .logo {
                font-size: 2rem;
            }

            .message-content {
                max-width: 85%;
            }

            .input-area {
                flex-direction: column;
            }

            .send-btn {
                justify-content: center;
            }
        }

        /* Code Block Styling */
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }

        code {
            font-family: 'Fira Code', monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <!-- Background Animation -->
    <div class="bg-animation">
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header>
            <h1 class="logo">✨ Sovereign AI</h1>
            <p class="tagline">ผู้ช่วยอัจฉริยะที่เข้าใจภาษาไทย</p>
        </header>

        <!-- Chat Container -->
        <div class="chat-container">
            <!-- Status -->
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span>พร้อมใช้งาน</span>
            </div>

            <!-- Messages Area -->
            <div class="messages" id="messages">
                <!-- Welcome Screen -->
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">🤖</div>
                    <h2 class="welcome-title">ยินดีต้อนรับสู่ Sovereign AI</h2>
                    <p class="welcome-subtitle">
                        ฉันสามารถช่วยคุณคำนวณคณิตศาสตร์<br>
                        ค้นหาข้อมูล และตอบคำถามต่างๆ ได้
                    </p>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <button class="quick-action" onclick="sendQuickMessage('หาผลบวกของ 123 และ 456')">➕ หาผลบวก</button>
                <button class="quick-action" onclick="sendQuickMessage('หาผลต่างของ 100 และ 25')">➖ หาผลต่าง</button>
                <button class="quick-action" onclick="sendQuickMessage('ค้นหาไฟล์เอกสาร')">🔍 ค้นหาไฟล์</button>
                <button class="quick-action" onclick="sendQuickMessage('เปิดไฟห้องนอน')">💡 เปิดไฟ</button>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="userInput" 
                        placeholder="พิมพ์ข้อความของคุณที่นี่..." 
                        autocomplete="off"
                        onkeypress="handleKeyPress(event)"
                    >
                </div>
                <button class="send-btn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z"/>
                    </svg>
                    ส่ง
                </button>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let messageCount = 0;

        // Format time
        function formatTime() {
            const now = new Date();
            return now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
        }

        // Add message to chat
        function addMessage(content, isUser = false) {
            const messagesDiv = document.getElementById('messages');
            const welcomeScreen = document.getElementById('welcomeScreen');
            
            // Hide welcome screen on first message
            if (welcomeScreen && messageCount === 0) {
                welcomeScreen.style.display = 'none';
            }
            
            messageCount++;

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            
            messageDiv.innerHTML = `
                <div class="avatar ${isUser ? 'user' : 'ai'}">
                    ${isUser ? '👤' : '🤖'}
                </div>
                <div class="message-content">
                    ${content}
                    <div class="message-time">${formatTime()}</div>
                </div>
            `;
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Show/hide typing indicator
        function showTyping(show) {
            const indicator = document.getElementById('typingIndicator');
            if (show) {
                indicator.classList.add('active');
                const messagesDiv = document.getElementById('messages');
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            } else {
                indicator.classList.remove('active');
            }
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) return;

            // Add user message
            addMessage(message, true);
            input.value = '';

            // Show typing indicator
            showTyping(true);

            try {
                // Call API (replace with actual endpoint)
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message }),
                });

                if (response.ok) {
                    const data = await response.json();
                    showTyping(false);
                    addMessage(formatResponse(data.response || data.message || 'ได้รับข้อความแล้ว'));
                } else {
                    throw new Error('API error');
                }
            } catch (error) {
                console.error('Error:', error);
                showTyping(false);
                // Demo response for testing without backend
                addMessage(getDemoResponse(message));
            }
        }

        // Format response (handle code blocks, etc.)
        function formatResponse(text) {
            // Simple formatting - can be enhanced with markdown parser
            return text
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        // Demo responses for testing
        function getDemoResponse(message) {
            const lowerMsg = message.toLowerCase();
            
            if (lowerMsg.includes('ผลบวก') || lowerMsg.includes('+')) {
                return '✅ <strong>ผลการคำนวณ:</strong><br>ผลลัพธ์คือ 579';
            } else if (lowerMsg.includes('ผลต่าง') || lowerMsg.includes('-')) {
                return '✅ <strong>ผลการคำนวณ:</strong><br>ผลลัพธ์คือ 75';
            } else if (lowerMsg.includes('ค้นหา')) {
                return '🔍 <strong>กำลังค้นหา...</strong><br>พบไฟล์ที่เกี่ยวข้อง 3 รายการ';
            } else if (lowerMsg.includes('เปิดไฟ')) {
                return '💡 <strong>คำสั่งดำเนินการ:</strong><br>เปิดไฟห้องนอนเรียบร้อยแล้ว';
            } else {
                return '🤖 ได้รับข้อความของคุณแล้ว: "' + message + '"<br><br>กรุณาเชื่อมต่อ API เพื่อการตอบสนองที่สมบูรณ์';
            }
        }

        // Send quick message
        function sendQuickMessage(message) {
            document.getElementById('userInput').value = message;
            sendMessage();
        }

        // Handle Enter key
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Focus input on load
        window.onload = function() {
            document.getElementById('userInput').focus();
        };
    </script>
</body>
</html>
